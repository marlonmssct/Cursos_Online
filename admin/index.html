<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Gestão - NEXA Cursos Online</title>
    <!-- Google Fonts do Guia NEXA: Sora e Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="style.css">

    <!-- SweetAlert2: feedbacks visuais e confirmação de ações sensíveis -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <!-- Header Fixo Dinâmico NEXA -->
    <header class="global-header">
        <div class="header-container">
            <a href="../catalogo/index.html" class="logo-brand">
                <svg class="nexa-logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50 5 L88 26.5 C92 28.8 94 32.3 94 36.8 L94 63.2 C94 67.7 92 71.2 88 73.5 L50 95 C46 97.3 42 97.3 38 95 L12 73.5 C8 71.2 6 67.7 6 63.2 L6 36.8 C6 32.3 8 28.8 12 26.5 Z" fill="#20153B"/>
                    <path d="M30 68 V34 C30 30 35 28 38 31 L64 64 C67 67 72 65 72 61 V30" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M42 43.5 L57 51 L42 58.5 Z" fill="#F3A730"/>
                </svg>
                <span class="logo-text">nexa</span>
            </a>

            <nav>
                <ul class="nav-menu">
                    <li><a href="../catalogo/index.html" class="nav-link">Catálogo</a></li>
                    <li><a href="../perfil/index.html" class="nav-link">Meu Perfil</a></li>
                    <li><a href="../admin/index.html" class="nav-link active">Painel Gestão</a></li>
                </ul>
            </nav>

            <div class="user-widget">
                <span id="userWelcome" style="font-size: 0.9rem; font-weight: 600;"></span>
                <span id="userRoleBadge" class="badge-role"></span>
                <button id="btnLogout" class="btn btn-secondary btn-sm">Sair</button>
            </div>
        </div>
    </header>

    <!-- Conteúdo do Painel Administrativo -->
    <main class="admin-container">
        <div class="admin-header">
            <h2>Painel de Gestão e Administração</h2>
            <p id="adminSubtitle">Verificando permissões de acesso...</p>
        </div>

        <!-- Todo o conteúdo abaixo (abas, cards, modais) é renderizado via JS       -->
        <!-- de acordo com o cargo (RBAC): itens sem permissão nunca são criados no DOM -->
        <div id="adminRoot"></div>
    </main>

    <footer class="global-footer">
        <p>&copy; 2026 <strong>NEXA Cursos Online</strong>. Plataforma de alta performance e aprendizado contínuo.</p>
    </footer>

    <script src="../js/api.js"></script>
    <script src="script.js"></script>
</body>
</html>
