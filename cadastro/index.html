<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Plataforma de Cursos</title>
    <!-- CSS Global e CSS Específico da Tela de Cadastro -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../login/style.css">
</head>
<body>

    <!-- Header Fixo da Plataforma -->
    <header class="global-header">
        <div class="header-container">
            <a href="#" class="logo-brand">🎓 Cursos<span>Online</span></a>
            <span class="badge-role aluno">Criar Conta</span>
        </div>
    </header>

    <!-- Formulário de Cadastro -->
    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Criar Nova Conta</h2>
                <p>Preencha os dados abaixo para se cadastrar</p>
            </div>

            <form id="formCadastro" class="auth-form">
                <div class="form-group">
                    <label for="nome">Nome Completo (Mín. 3 caracteres)</label>
                    <input type="text" id="nome" placeholder="Digite seu nome completo" required minlength="3">
                </div>

                <div class="form-group">
                    <label for="email">E-mail Válido</label>
                    <input type="email" id="email" placeholder="seu.email@exemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="senha">Senha (Mín. 6 caracteres)</label>
                    <input type="password" id="senha" placeholder="Crie uma senha segura" required minlength="6">
                </div>

                <div class="form-group">
                    <label for="role">Perfil de Acesso (Role)</label>
                    <select id="role" required>
                        <option value="aluno" selected>Aluno (Acesso aos Cursos)</option>
                        <option value="editor">Editor (Gestor de Conteúdo)</option>
                        <option value="admin">Administrador (Acesso Total)</option>
                    </select>
                </div>

                <div id="feedback" class="feedback-box hidden"></div>

                <button type="submit" class="btn btn-primary btn-block">Finalizar Cadastro</button>
            </form>

            <div class="auth-footer">
                <p>Já possui uma conta? <a href="../login/index.html">Faça login aqui</a></p>
            </div>
        </div>
    </main>

    <footer class="global-footer">
        <p>&copy; 2026 Plataforma de Cursos Online. Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
