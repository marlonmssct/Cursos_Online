<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - NEXA Cursos Online</title>
    <!-- Google Fonts do Guia NEXA: Sora e Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- CSS Global NEXA e CSS Específico de Cadastro -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../login/style.css">
</head>
<body>

    <!-- Header Fixo da Plataforma NEXA -->
    <header class="global-header">
        <div class="header-container">
            <a href="#" class="logo-brand">
                <svg class="nexa-logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50 5 L88 26.5 C92 28.8 94 32.3 94 36.8 L94 63.2 C94 67.7 92 71.2 88 73.5 L50 95 C46 97.3 42 97.3 38 95 L12 73.5 C8 71.2 6 67.7 6 63.2 L6 36.8 C6 32.3 8 28.8 12 26.5 Z" fill="#20153B"/>
                    <path d="M30 68 V34 C30 30 35 28 38 31 L64 64 C67 67 72 65 72 61 V30" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M42 43.5 L57 51 L42 58.5 Z" fill="#F3A730"/>
                </svg>
                <span class="logo-text">nexa</span>
            </a>
            <span class="badge-role aluno">Criar Conta</span>
        </div>
    </header>

    <!-- Formulário de Cadastro NEXA -->
    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Criar Conta na NEXA</h2>
                <p>Preencha os dados abaixo para se cadastrar</p>
            </div>

            <form id="formCadastro" class="auth-form">
                <div class="form-group">
                    <label for="nome">Nome Completo (Mín. 3 caracteres)</label>
                    <input type="text" id="nome" placeholder="Digite seu nome completo" required minlength="3">
                </div>

                <div class="form-group">
                    <label for="email">E-mail Válido</label>
                    <input type="email" id="email" placeholder="seu.email@exemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="senha">Senha (Mín. 6 caracteres)</label>
                    <input type="password" id="senha" placeholder="Crie uma senha segura" required minlength="6">
                </div>

                <div class="form-group">
                    <label for="role">Perfil de Acesso (Role)</label>
                    <select id="role" required>
                        <option value="aluno" selected>Aluno (Acesso aos Cursos)</option>
                        <option value="editor">Editor (Gestor de Conteúdo)</option>
                        <option value="admin">Administrador (Acesso Total)</option>
                    </select>
                </div>

                <div id="feedback" class="feedback-box hidden"></div>

                <button type="submit" class="btn btn-primary btn-block">Finalizar Cadastro</button>
            </form>

            <div class="auth-footer">
                <p>Já possui uma conta? <a href="../login/index.html">Faça login aqui</a></p>
            </div>
        </div>
    </main>

    <footer class="global-footer">
        <p>&copy; 2026 <strong>NEXA Cursos Online</strong>. Plataforma de alta performance e aprendizado contínuo.</p>
    </footer>

    <script src="../js/api.js"></script>
    <script src="script.js"></script>
</body>
</html>
